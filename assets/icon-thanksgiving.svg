<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="70%">
      <stop offset="0" stop-color="#5a3216"/>
      <stop offset="1" stop-color="#241209"/>
    </radialGradient>
  </defs>
  <rect width="100" height="100" fill="url(#bg)"/>
  <!-- tail feathers fan (kept inside the maskable safe zone) -->
  <g transform="translate(50 54) scale(0.88)">
    <g id="f">
      <ellipse cx="0" cy="-27" rx="6.5" ry="16" fill="#c0392b" transform="rotate(-72)"/>
      <ellipse cx="0" cy="-27" rx="6.5" ry="16" fill="#d9731f" transform="rotate(-48)"/>
      <ellipse cx="0" cy="-27" rx="6.5" ry="16" fill="#f4b13a" transform="rotate(-24)"/>
      <ellipse cx="0" cy="-27" rx="6.5" ry="16" fill="#8a9a2a" transform="rotate(0)"/>
      <ellipse cx="0" cy="-27" rx="6.5" ry="16" fill="#f4b13a" transform="rotate(24)"/>
      <ellipse cx="0" cy="-27" rx="6.5" ry="16" fill="#d9731f" transform="rotate(48)"/>
      <ellipse cx="0" cy="-27" rx="6.5" ry="16" fill="#c0392b" transform="rotate(72)"/>
    </g>
    <!-- body -->
    <ellipse cx="0" cy="6" rx="19" ry="20" fill="#7a4a24"/>
    <ellipse cx="0" cy="10" rx="12" ry="13" fill="#9a6535"/>
    <!-- head -->
    <circle cx="0" cy="-8" r="10" fill="#7a4a24"/>
    <!-- eyes -->
    <circle cx="-4" cy="-10" r="2.2" fill="#fff"/><circle cx="4" cy="-10" r="2.2" fill="#fff"/>
    <circle cx="-3.6" cy="-10" r="1.1" fill="#111"/><circle cx="4.4" cy="-10" r="1.1" fill="#111"/>
    <!-- beak + wattle -->
    <polygon points="-3,-5 3,-5 0,0" fill="#f4b13a"/>
    <path d="M0 0 q-1 8 3 8 q4 0 1 -8 z" fill="#d62828"/>
    <!-- feet -->
    <path d="M-8 25 l-3 7 M-8 25 l2 7 M8 25 l3 7 M8 25 l-2 7" stroke="#f4b13a" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>
